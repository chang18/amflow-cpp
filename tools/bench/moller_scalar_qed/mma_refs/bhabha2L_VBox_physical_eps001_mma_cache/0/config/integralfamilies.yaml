integralfamilies:
  - name: "bhabha2vbox"
    loop_momenta: [l1, l2]
    top_level_sectors: [127]
    propagators:
      - [ "-1 + l1^2", 0 ]
      - [ "-1 + l2^2", 0 ]
      - [ "(l1 + l2)^2", 0 ]
      - [ "(l1 + p1)^2", 0 ]
      - [ "-1 + (l1 + p1 + p2)^2", 0 ]
      - [ "(l1 + p3)^2", 0 ]
      - [ "-1 + (l1 + l2 + p1)^2", 0 ]
      - [ "(l2 + p3)^2", 0 ]
      - [ "(l2 + p2)^2", 0 ]
    cut_propagators: []